<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR Cric Master</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f3f6;
}

header{
  background:#075e54;
  color:white;
  text-align:center;
  padding:20px;
}

.container{
  padding:15px;
}

.card{
  background:white;
  padding:18px;
  margin-bottom:15px;
  border-radius:12px;
  box-shadow:0 2px 6px #ccc;
}

input,select{
  width:100%;
  padding:13px;
  margin:7px 0;
  box-sizing:border-box;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:8px;
  background:#075e54;
  color:white;
  font-size:17px;
}

.score{
  text-align:center;
  font-size:42px;
  font-weight:bold;
}

.small{
  text-align:center;
  font-size:18px;
}

.hidden{
  display:none;
}

.runbuttons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.runbuttons button{
  margin:0;
  font-size:20px;
}

.reset{
  background:#c62828;
}
</style>
</head>

<body>

<header>
<h1>🏏 HR Cric Master</h1>
<p>Cricket Scoring</p>
</header>

<div class="container">

<div id="setup">

<div class="card">
<h2>Match Setup</h2>

<input id="matchName" placeholder="Match Name">

<input id="teamA" placeholder="Team A Name">

<input id="teamB" placeholder="Team B Name">

<input id="oversInput" type="number" placeholder="Total Overs">

<select id="toss">
<option value="">Who won the toss?</option>
<option value="A">Team A</option>
<option value="B">Team B</option>
</select>

<select id="decision">
<option value="">Choose decision</option>
<option value="bat">Bat First</option>
<option value="bowl">Bowl First</option>
</select>

<button onclick="startMatch()">🏏 Start Match</button>

</div>

<div class="card">
<h3>Team A Players</h3>

<div id="playersA"></div>

</div>

<div class="card">
<h3>Team B Players</h3>

<div id="playersB"></div>

</div>

</div>


<div id="scorer" class="hidden">

<div class="card">
<h2 id="matchTitle"></h2>
<p id="teams"></p>
</div>

<div class="card">
<div class="score" id="score">0/0</div>
<div class="small">
Overs: <span id="overs">0.0</span>
</div>
</div>

<div class="card">

<h3>Batting</h3>

<p>🏏 Striker: <b id="striker">-</b></p>
<p>🏏 Non-Striker: <b id="nonStriker">-</b></p>
<p>🎯 Bowler: <b id="bowler">-</b></p>

</div>

<div class="card">

<h3>Runs</h3>

<div class="runbuttons">

<button onclick="addRun(0)">0</button>
<button onclick="addRun(1)">1</button>
<button onclick="addRun(2)">2</button>
<button onclick="addRun(3)">3</button>
<button onclick="addRun(4)">4</button>
<button onclick="addRun(6)">6</button>

<button onclick="wide()">Wide</button>
<button onclick="noball()">No Ball</button>
<button onclick="wicket()">Wicket</button>

</div>

</div>

<div class="card">

<h3>Scorecard</h3>

<p>Total Runs: <b id="totalRuns">0</b></p>
<p>Wickets: <b id="totalWickets">0</b></p>
<p>Balls: <b id="totalBalls">0</b></p>

<button class="reset" onclick="resetMatch()">🔄 Reset</button>

</div>

</div>

</div>


<script>

let runs=0;
let wickets=0;
let balls=0;
let maxOvers=0;

function createPlayers(){

let a="";
let b="";

for(let i=1;i<=11;i++){

a += `<input id="a${i}" placeholder="Team A Player ${i}">`;

b += `<input id="b${i}" placeholder="Team B Player ${i}">`;

}

document.getElementById("playersA").innerHTML=a;
document.getElementById("playersB").innerHTML=b;

}

createPlayers();


function startMatch(){

let match=document.getElementById("matchName").value;
let teamA=document.getElementById("teamA").value;
let teamB=document.getElementById("teamB").value;
maxOvers=document.getElementById("oversInput").value;

if(!teamA || !teamB || !maxOvers){

alert("Team names aur overs bharo");

return;

}

document.getElementById("matchTitle").innerText=
match || "Cricket Match";

document.getElementById("teams").innerText=
teamA+" vs "+teamB;

document.getElementById("setup").classList.add("hidden");

document.getElementById("scorer").classList.remove("hidden");

update();

}


function addRun(r){

runs += r;
balls++;

update();

}


function wide(){

runs++;
update();

}


function noball(){

runs++;
update();

}


function wicket(){

if(wickets < 10){

wickets++;
balls++;

}

update();

}


function update(){

document.getElementById("score").innerText=
runs+"/"+wickets;

document.getElementById("totalRuns").innerText=runs;

document.getElementById("totalWickets").innerText=wickets;

document.getElementById("totalBalls").innerText=balls;

let over=Math.floor(balls/6)+"."+(balls%6);

document.getElementById("overs").innerText=over;

}


function resetMatch(){

runs=0;
wickets=0;
balls=0;

update();

}

</script>

</body>
</html>
