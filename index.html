<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cricket Scorer</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f4f7;
    color:#111;
}
.header{
    background:#087f23;
    color:white;
    padding:18px;
    text-align:center;
}
.header h1{margin:0;font-size:28px;}
.container{
    max-width:600px;
    margin:auto;
    padding:15px;
}
.scorebox{
    background:white;
    border-radius:15px;
    padding:20px;
    text-align:center;
    box-shadow:0 2px 8px #bbb;
}
.score{
    font-size:48px;
    font-weight:bold;
}
.overs{
    font-size:20px;
    margin-top:5px;
}
.section{
    background:white;
    padding:15px;
    margin-top:15px;
    border-radius:15px;
    box-shadow:0 2px 6px #ccc;
}
.section h2{
    margin-top:0;
    font-size:20px;
}
button{
    border:0;
    border-radius:10px;
    padding:13px;
    margin:5px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}
.run{
    background:#e8f5e9;
    min-width:60px;
}
.special{
    background:#fff3cd;
}
.wicket{
    background:#f44336;
    color:white;
}
.undo{
    background:#555;
    color:white;
}
.reset{
    background:#111;
    color:white;
    width:100%;
}
.history{
    max-height:300px;
    overflow:auto;
}
.ball{
    padding:10px;
    border-bottom:1px solid #ddd;
    font-size:16px;
}
.green{color:green;font-weight:bold;}
.red{color:red;font-weight:bold;}
</style>
</head>

<body>

<div class="header">
    <h1>🏏 Cricket Scorer</h1>
</div>

<div class="container">

<div class="scorebox">
    <div id="score" class="score">0/0</div>
    <div id="overs" class="overs">Overs: 0.0</div>
</div>

<div class="section">
<h2>Runs</h2>

<button class="run" onclick="addRuns(0)">0</button>
<button class="run" onclick="addRuns(1)">1</button>
<button class="run" onclick="addRuns(2)">2</button>
<button class="run" onclick="addRuns(3)">3</button>
<button class="run" onclick="addRuns(4)">4</button>
<button class="run" onclick="addRuns(5)">5</button>
<button class="run" onclick="addRuns(6)">6</button>

</div>

<div class="section">
<h2>Extras</h2>

<button class="special" onclick="extra('wide',1)">Wide +1</button>

<button class="special" onclick="extra('wide',2)">Wide +2</button>

<button class="special" onclick="extra('wide',3)">Wide +3</button>

<button class="special" onclick="extra('wide',4)">Wide +4</button>

<button class="special" onclick="extra('wide',5)">Wide +5</button>

<br>

<button class="special" onclick="extra('bye',1)">Bye 1</button>
<button class="special" onclick="extra('bye',2)">Bye 2</button>
<button class="special" onclick="extra('bye',3)">Bye 3</button>
<button class="special" onclick="extra('bye',4)">Bye 4</button>

<br>

<button class="special" onclick="extra('legbye',1)">LB 1</button>
<button class="special" onclick="extra('legbye',2)">LB 2</button>
<button class="special" onclick="extra('legbye',3)">LB 3</button>
<button class="special" onclick="extra('legbye',4)">LB 4</button>

</div>

<div class="section">
<h2>No Ball</h2>

<button class="special" onclick="noBall(0)">NB +0</button>
<button class="special" onclick="noBall(1)">NB +1</button>
<button class="special" onclick="noBall(2)">NB +2</button>
<button class="special" onclick="noBall(3)">NB +3</button>
<button class="special" onclick="noBall(4)">NB +4</button>
<button class="special" onclick="noBall(5)">NB +5</button>
<button class="special" onclick="noBall(6)">NB +6</button>

</div>

<div class="section">
<h2>Wicket</h2>

<button class="wicket" onclick="wicket()">WICKET</button>

<br>

<button class="wicket" onclick="runOut(0)">Run Out +0</button>
<button class="wicket" onclick="runOut(1)">Run Out +1</button>
<button class="wicket" onclick="runOut(2)">Run Out +2</button>
<button class="wicket" onclick="runOut(3)">Run Out +3</button>

</div>

<div class="section">
<h2>Controls</h2>

<button class="undo" onclick="undo()">↩ Undo</button>

<button class="reset" onclick="resetScore()">RESET MATCH</button>

</div>

<div class="section">
<h2>Ball by Ball</h2>
<div id="history" class="history"></div>
</div>

</div>

<script>

let runs = 0;
let wickets = 0;
let balls = 0;

let history = [];
let stateHistory = [];

function saveState(){

    stateHistory.push({
        runs:runs,
        wickets:wickets,
        balls:balls,
        history:[...history]
    });

}

function update(){

    document.getElementById("score").innerText =
        runs + "/" + wickets;

    let overs =
        Math.floor(balls/6) + "." + (balls%6);

    document.getElementById("overs").innerText =
        "Overs: " + overs;

    let h = document.getElementById("history");

    h.innerHTML = "";

    history.slice().reverse().forEach(function(item){

        let div = document.createElement("div");

        div.className = "ball";

        div.innerHTML = item;

        h.appendChild(div);

    });

}

function addRuns(r){

    saveState();

    runs += r;
    balls++;

    history.push(
        "<span class='green'>" + r + " run" +
        (r==1 ? "" : "s") + "</span>"
    );

    update();

}

function extra(type,r){

    saveState();

    runs += r;

    if(type === "wide"){

        history.push(
            "<span class='green'>Wide +" + r + "</span>"
        );

    }else{

        balls++;

        let name = type === "bye" ? "Bye" : "Leg Bye";

        history.push(
            "<span class='green'>" +
            name + " " + r +
            "</span>"
        );

    }

    update();

}

function noBall(r){

    saveState();

    runs += 1 + r;

    history.push(
        "<span class='green'>No Ball + " +
        r + " bat run = " +
        (1+r) + " runs</span>"
    );

    /*
    No-ball ball count nahi badhta.
    */

    update();

}

function wicket(){

    saveState();

    wickets++;

    balls++;

    history.push(
        "<span class='red'>WICKET</span>"
    );

    update();

}

function runOut(r){

    saveState();

    runs += r;

    wickets++;

    balls++;

    history.push(
        "<span class='red'>RUN OUT + " +
        r + " run" +
        (r==1 ? "" : "s") +
        "</span>"
    );

    update();

}

function undo(){

    if(stateHistory.length === 0){

        alert("Nothing to undo");

        return;

    }

    let previous =
        stateHistory.pop();

    runs = previous.runs;
    wickets = previous.wickets;
    balls = previous.balls;
    history = previous.history;

    update();

}

function resetScore(){

    if(!confirm("Reset complete match?")) return;

    runs = 0;
    wickets = 0;
    balls = 0;

    history = [];
    stateHistory = [];

    update();

}

update();

</script>

</body>
</html>
